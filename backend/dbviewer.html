<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnortVision — Database Explorer</title>
<style>
  :root{
    --bg:#020409; --panel:#070b12; --panel2:#0a0e16; --line:#1a2535;
    --txt:#e5e7eb; --dim:#8e8e93; --dim2:#4a5568; --accent:#4a9eff; --accent2:#0a84ff;
    --green:#30d158; --red:#ff2d55; --amber:#ff9f0a; --violet:#bf5af2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1c2737;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* Header */
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#060a11,#020409);flex-shrink:0}
  header .logo{display:flex;align-items:center;gap:8px}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  header h1{font-size:14px;font-weight:800;letter-spacing:.18em;margin:0}
  header h1 span{color:var(--accent);font-weight:300}
  header .meta{margin-left:auto;display:flex;gap:18px;align-items:center;color:var(--dim);font-size:11px}
  header .meta b{color:var(--txt);font-weight:700}
  header .key-btn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 10px;font-size:11px}
  header .key-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* Layout */
  .wrap{display:flex;flex:1;min-height:0}
  aside{width:240px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;flex-shrink:0;padding:10px}
  aside .ttl{font-size:9px;letter-spacing:.16em;color:var(--dim2);font-weight:700;padding:8px 8px 10px}
  .tbl-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
  .tbl-item:hover{background:var(--panel2)}
  .tbl-item.active{background:#0a84ff1a;border-color:#0a84ff44}
  .tbl-item .nm{font-weight:700;color:var(--txt)}
  .tbl-item.active .nm{color:var(--accent)}
  .tbl-item .ct{font-size:10px;color:var(--dim2);background:#0d1420;border-radius:20px;padding:2px 8px}

  main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .toolbar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
  .toolbar .tname{font-size:14px;font-weight:800;color:#fff}
  .toolbar .tname em{color:var(--dim);font-style:normal;font-weight:400;font-size:11px;margin-left:8px}
  .search{position:relative}
  .search input{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:#fff;font-family:inherit;font-size:12px;padding:6px 10px 6px 28px;width:240px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:8px;top:7px}
  select,.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--dim);font-family:inherit;font-size:11px;padding:6px 10px;outline:none}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}
  .spacer{margin-left:auto}

  .tablewrap{flex:1;overflow:auto;min-height:0}
  table{border-collapse:collapse;width:100%;font-size:12px}
  thead th{position:sticky;top:0;background:#070b12;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-weight:700;letter-spacing:.04em;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
  thead th:hover{color:var(--accent)}
  thead th .arr{color:var(--accent);margin-left:5px}
  thead th.actions{cursor:default;width:48px}
  tbody td{padding:7px 12px;border-bottom:1px solid #0d141f;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
  tbody tr:hover{background:#0a0f18}
  tbody td.num{color:#9ca7b8;text-align:right}
  tbody td.pkcol{color:var(--dim2)}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;font-weight:700}
  .trash{background:transparent;border:none;color:var(--dim2);padding:3px;border-radius:5px;line-height:0}
  .trash:hover{color:var(--red);background:#ff2d5518}
  .empty{padding:50px;text-align:center;color:var(--dim2)}

  footer{display:flex;align-items:center;gap:14px;padding:9px 16px;border-top:1px solid var(--line);flex-shrink:0;font-size:11px;color:var(--dim)}
  footer .btn{padding:5px 11px}
  footer .pginfo b{color:var(--txt)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(2,4,9,.8);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:380px;max-width:92vw}
  .modal h3{margin:0 0 6px;font-size:15px}
  .modal p{color:var(--dim);font-size:12px;line-height:1.5;margin:0 0 16px}
  .modal input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:#fff;font-family:inherit;padding:10px;font-size:13px;outline:none;margin-bottom:14px}
  .modal input:focus{border-color:var(--accent)}
  .modal .row{display:flex;gap:8px;justify-content:flex-end}
  .modal .btn-primary{background:var(--accent2);border:none;color:#fff;border-radius:8px;padding:9px 16px;font-weight:700;font-size:12px}
  .modal .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:9px 16px;font-size:12px}
  .modal .btn-danger{background:var(--red);border:none;color:#fff;border-radius:8px;padding:9px 16px;font-weight:700;font-size:12px}
  .modal pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:11px;color:#cdd5e0;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-all}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:12px 16px;font-size:12px;z-index:60;opacity:0;transform:translateY(10px);transition:.25s;max-width:340px}
  .toast.show{opacity:1;transform:none}
  .toast.err{border-left-color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" style="display:block">
      <defs><linearGradient id="g" x1="2" y1="1" x2="30" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#ff2d55"/><stop offset="1" stop-color="#ff6b35"/></linearGradient></defs>
      <path d="M16 1.8 L28 5.8 V15.2 C28 23 22.8 28.4 16 30.6 C9.2 28.4 4 23 4 15.2 V5.8 Z" fill="url(#g)"/>
      <circle cx="16" cy="14.8" r="6.4" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="16" cy="14.8" r="1.15" fill="#fff"/>
      <path d="M16 14.8 L21.4 10.9" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <h1>SNORT<span>VISION</span> · DB EXPLORER <span style="font-weight:300;color:#4a5568">v0.2</span></h1>
  </div>
  <div class="meta">
    <span>DB size <b id="dbsize">—</b></span>
    <span>Total rows <b id="totalrows">—</b></span>
    <button class="key-btn" id="changeKey">⚙ API key</button>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="ttl">TABLES</div>
    <div id="tablelist"></div>
  </aside>
  <main>
    <div class="toolbar">
      <span class="tname" id="tname">—</span>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4a5568" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="Search this table…" autocomplete="off">
      </div>
      <select id="pagesize">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="250">250 / page</option>
      </select>
      <button class="btn" id="refresh">↻ Refresh</button>
      <div class="spacer"></div>
      <button class="btn" id="export">⤓ CSV</button>
      <button class="btn danger" id="purge">🗑 Purge table</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none"></div>
    </div>
    <footer>
      <button class="btn" id="prev">‹ Prev</button>
      <button class="btn" id="next">Next ›</button>
      <span class="pginfo" id="pginfo">—</span>
      <div class="spacer"></div>
      <a href="/" id="backapp">← Back to SnortVision</a>
    </footer>
  </main>
</div>

<!-- API key modal -->
<div class="overlay" id="keyModal">
  <div class="modal">
    <h3>API Key required</h3>
    <p>The database is protected. Enter your SnortVision API key (the same one used in the app's Connection page). It's kept only in this browser tab.</p>
    <input type="password" id="keyInput" placeholder="sk-…" autocomplete="off">
    <div class="row">
      <button class="btn-primary" id="keySave">Unlock</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="overlay" id="confirmModal">
  <div class="modal">
    <h3 id="cfTitle">Confirm</h3>
    <p id="cfBody"></p>
    <div class="row">
      <button class="btn-ghost" id="cfCancel">Cancel</button>
      <button class="btn-danger" id="cfOk">Delete</button>
    </div>
  </div>
</div>

<!-- Row detail modal -->
<div class="overlay" id="rowModal">
  <div class="modal" style="width:560px">
    <h3>Row detail</h3>
    <pre id="rowJson"></pre>
    <div class="row" style="margin-top:14px"><button class="btn-ghost" id="rowClose">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const KEY_STORE = "sv_db_key";
  const PROTO_COL = {TCP:"#0a84ff",UDP:"#30d158",ICMP:"#ff9f0a",IP:"#bf5af2"};
  const SEV_COL   = {critical:"#ff2d55",high:"#ff9f0a",medium:"#ffd60a",low:"#30d158",info:"#0a84ff"};
  const DIR_COL   = {inbound:"#ff9f0a",outbound:"#0a84ff",external:"#bf5af2"};

  // Never accept the key from the URL (it would leak via history / proxy logs).
  // Defensive: strip any stale ?key= from an old bookmark before anything reads it.
  if(new URLSearchParams(location.search).has("key")){ history.replaceState(null,"",location.pathname); }
  // Same-origin: reuse the SnortVision app's stored API key (localStorage sv_apiKey),
  // else this tab's own sessionStorage, else prompt via the modal.
  function readAppKey(){ try { return JSON.parse(localStorage.getItem("sv_apiKey")||'""') || ""; } catch { return ""; } }
  let apiKey = sessionStorage.getItem(KEY_STORE) || readAppKey() || "";

  let state = { table:null, columns:[], pk:"id", sort:null, dir:"desc", q:"", limit:50, offset:0, total:0, rows:[] };
  let tablesMeta = [];
  let searchTimer = null;

  function headers(){ return apiKey ? {"x-api-key":apiKey} : {}; }
  async function api(path, opts={}){
    const r = await fetch("/api"+path, {...opts, headers:{...headers(), ...(opts.headers||{})}});
    if(r.status===401){ openKeyModal(); throw new Error("unauthorized"); }
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }
  function toast(msg, err){
    const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":"");
    setTimeout(()=>t.className="toast"+(err?" err":""), 2800);
  }
  function fmtBytes(n){ n=+n||0; return n>=1e9?(n/1e9).toFixed(2)+" GB":n>=1e6?(n/1e6).toFixed(1)+" MB":n>=1e3?(n/1e3).toFixed(1)+" KB":n+" B"; }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ── Tables sidebar ──
  async function loadTables(){
    const d = await api("/db/tables");
    tablesMeta = d.tables;
    $("#dbsize").textContent = fmtBytes(d.dbSizeBytes);
    $("#totalrows").textContent = d.tables.reduce((s,t)=>s+t.rows,0).toLocaleString();
    const list = $("#tablelist"); list.innerHTML="";
    d.tables.forEach(t=>{
      const el=document.createElement("div");
      el.className="tbl-item"+(state.table===t.name?" active":"");
      el.innerHTML=`<span class="nm">${t.name}</span><span class="ct">${t.rows.toLocaleString()}</span>`;
      el.onclick=()=>selectTable(t.name);
      list.appendChild(el);
    });
    if(!state.table && d.tables.length) selectTable(d.tables[0].name);
  }

  function selectTable(name){
    if(state.table!==name){ state.sort=null; state.dir="desc"; state.q=""; state.offset=0; $("#search").value=""; }
    state.table=name;
    document.querySelectorAll(".tbl-item").forEach(e=>e.classList.toggle("active", e.querySelector(".nm").textContent===name));
    loadData();
  }

  // ── Data grid ──
  async function loadData(){
    if(!state.table) return;
    const p = new URLSearchParams({limit:state.limit, offset:state.offset, dir:state.dir});
    if(state.sort) p.set("sort", state.sort);
    if(state.q) p.set("q", state.q);
    let d;
    try { d = await api(`/db/table/${state.table}?`+p.toString()); }
    catch(e){ if(e.message!=="unauthorized") toast(e.message,true); return; }
    state.columns=d.columns; state.pk=d.pk; state.total=d.total; state.rows=d.rows;
    if(!state.sort) state.sort=d.sort;
    $("#tname").innerHTML = `${esc(d.name)} <em>${d.label||""}</em>`;
    render();
  }

  function cellHtml(col, val, table){
    if(val===null||val===undefined) return '<span style="color:#3a4456">∅</span>';
    let s = String(val);
    if(col==="severity" && SEV_COL[s]) return `<span class="pill" style="background:${SEV_COL[s]}22;color:${SEV_COL[s]}">${esc(s)}</span>`;
    if(col==="proto" && PROTO_COL[s]) return `<span class="pill" style="background:${PROTO_COL[s]}22;color:${PROTO_COL[s]}">${esc(s)}</span>`;
    if(col==="direction" && DIR_COL[s]) return `<span class="pill" style="background:${DIR_COL[s]}22;color:${DIR_COL[s]}">${esc(s)}</span>`;
    if(col==="action"){ const c=s==="BLOCKED"||s==="drop"?"#ff2d55":"#30d158"; return `<span class="pill" style="background:${c}22;color:${c}">${esc(s)}</span>`; }
    if((col==="raw"||col.length>0) && s.length>120) s=s.slice(0,120)+"…";
    return esc(s);
  }

  function render(){
    const {columns,rows,pk}=state;
    const thead=$("#thead"), tbody=$("#tbody"), empty=$("#empty");
    // header
    let h="<tr>";
    columns.forEach(c=>{
      const arr = state.sort===c ? `<span class="arr">${state.dir==="asc"?"▲":"▼"}</span>` : "";
      h+=`<th data-col="${esc(c)}">${esc(c)}${arr}</th>`;
    });
    h+='<th class="actions"></th></tr>';
    thead.innerHTML=h;
    thead.querySelectorAll("th[data-col]").forEach(th=>{
      th.onclick=()=>{ const c=th.dataset.col; if(state.sort===c){state.dir=state.dir==="asc"?"desc":"asc";}else{state.sort=c;state.dir="desc";} state.offset=0; loadData(); };
    });
    // body
    if(!rows.length){ tbody.innerHTML=""; empty.style.display="block"; empty.textContent = state.q?`No rows match “${state.q}”.`:"This table is empty."; }
    else{
      empty.style.display="none";
      tbody.innerHTML = rows.map(r=>{
        let tds = columns.map(c=>{
          const numeric = typeof r[c]==="number";
          const cls = c===pk?"pkcol":(numeric?"num":"");
          return `<td class="${cls}" title="${esc(r[c]??'')}">${cellHtml(c,r[c],state.table)}</td>`;
        }).join("");
        tds += `<td class="actions"><button class="trash" data-id="${esc(r[pk])}" title="Delete row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6"/></svg></button></td>`;
        return `<tr data-id="${esc(r[pk])}">${tds}</tr>`;
      }).join("");
      // row click → detail; trash → delete
      tbody.querySelectorAll("tr").forEach(tr=>{
        tr.onclick=(e)=>{ if(e.target.closest(".trash")) return; const row=rows.find(x=>String(x[pk])===tr.dataset.id); showRow(row); };
      });
      tbody.querySelectorAll(".trash").forEach(b=>{
        b.onclick=(e)=>{ e.stopPropagation(); confirmDeleteRow(b.dataset.id); };
      });
    }
    // footer
    const from = state.total? state.offset+1 : 0;
    const to = Math.min(state.offset+state.limit, state.total);
    $("#pginfo").innerHTML = `<b>${from.toLocaleString()}–${to.toLocaleString()}</b> of <b>${state.total.toLocaleString()}</b>`;
    $("#prev").disabled = state.offset<=0;
    $("#next").disabled = to>=state.total;
    $("#prev").style.opacity = state.offset<=0?.4:1;
    $("#next").style.opacity = to>=state.total?.4:1;
  }

  // ── Row detail ──
  function showRow(row){ $("#rowJson").textContent = JSON.stringify(row,null,2); $("#rowModal").classList.add("show"); }
  $("#rowClose").onclick=()=>$("#rowModal").classList.remove("show");

  // ── Delete row / purge ──
  let pendingAction=null;
  function openConfirm(title, body, okLabel, fn){
    $("#cfTitle").textContent=title; $("#cfBody").textContent=body; $("#cfOk").textContent=okLabel||"Delete";
    pendingAction=fn; $("#confirmModal").classList.add("show");
  }
  $("#cfCancel").onclick=()=>{ $("#confirmModal").classList.remove("show"); pendingAction=null; };
  $("#cfOk").onclick=async()=>{ const fn=pendingAction; $("#confirmModal").classList.remove("show"); pendingAction=null; if(fn) await fn(); };

  function confirmDeleteRow(id){
    openConfirm("Delete row?", `Permanently delete row where ${state.pk} = ${id} from “${state.table}”. This cannot be undone.`, "Delete row", async()=>{
      try{ const d=await api(`/db/table/${state.table}/row/${encodeURIComponent(id)}`,{method:"DELETE"}); toast(`Deleted ${d.deleted} row`); loadData(); loadTables(); }
      catch(e){ toast(e.message,true); }
    });
  }
  $("#purge").onclick=()=>{
    if(!state.table) return;
    openConfirm("Purge entire table?", `Permanently delete ALL ${state.total.toLocaleString()} rows from “${state.table}”. This cannot be undone.`, "Purge all", async()=>{
      try{ const d=await api(`/db/table/${state.table}`,{method:"DELETE"}); toast(`Purged ${d.deleted.toLocaleString()} rows`); state.offset=0; loadData(); loadTables(); }
      catch(e){ toast(e.message,true); }
    });
  };

  // ── CSV export (current page) ──
  $("#export").onclick=()=>{
    if(!state.rows.length){ toast("Nothing to export",true); return; }
    const cols=state.columns;
    const csv=[cols.join(",")].concat(state.rows.map(r=>cols.map(c=>{
      let v=r[c]==null?"":String(r[c]); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v;
    }).join(","))).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`${state.table}_${Date.now()}.csv`; a.click();
    toast(`Exported ${state.rows.length} rows`);
  };

  // ── Controls ──
  $("#search").oninput=(e)=>{ clearTimeout(searchTimer); searchTimer=setTimeout(()=>{ state.q=e.target.value.trim(); state.offset=0; loadData(); },350); };
  $("#pagesize").onchange=(e)=>{ state.limit=+e.target.value; state.offset=0; loadData(); };
  $("#refresh").onclick=()=>{ loadData(); loadTables(); };
  $("#prev").onclick=()=>{ state.offset=Math.max(0,state.offset-state.limit); loadData(); };
  $("#next").onclick=()=>{ state.offset+=state.limit; loadData(); };

  // ── API key modal ──
  function openKeyModal(){ $("#keyModal").classList.add("show"); $("#keyInput").focus(); }
  $("#changeKey").onclick=openKeyModal;
  $("#keySave").onclick=()=>{ const v=$("#keyInput").value.trim(); if(!v) return; apiKey=v; sessionStorage.setItem(KEY_STORE,v); $("#keyModal").classList.remove("show"); boot(); };
  $("#keyInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#keySave").click(); });

  async function boot(){
    try{ await loadTables(); }
    catch(e){ if(e.message==="unauthorized") openKeyModal(); else toast(e.message,true); }
  }
  boot();
})();
</script>
</body>
</html>
